; ============================================================================
; TERRA 2.0 — Field Explorer Firmware Build Configuration (PlatformIO)
; Supports dual hardware targets specified in NASA - Team 1.md:
;   1. ESP32-S3 (Wi-Fi + LoRaWAN + Edge AI Vector Instructions)
;   2. STM32L476RG (Ultra-Low-Power Sub-GHz LoRaWAN Field Station)
; ============================================================================

[platformio]
default_envs = esp32s3_field_explorer

[env:esp32s3_field_explorer]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D TERRA_MCU_ESP32S3=1

[env:stm32l4_field_explorer]
platform = ststm32
board = nucleo_l476rg
framework = arduino
monitor_speed = 115200
build_flags =
    -D TERRA_MCU_STM32L4=1
